[project]
name = "fraud-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "aiokafka>=0.11.0",
  "httpx>=0.27.0",
  "redis[asyncio]>=5.0.4",
  "python-jose[cryptography]>=3.3.0",
  "cryptography>=42.0.0",
  "structlog>=24.1.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "celery[redis]>=5.4.0",
  "hvac>=2.1.0",
  "boto3>=1.34.0",
  "scikit-learn>=1.4.0",
  "numpy>=1.26.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "anyio[trio]>=4.3.0",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
shared = { workspace = true }
