  "pydantic-settings>=2.2.0",
  "aiokafka>=0.11.0",
  "httpx>=0.27.0",
  "redis[asyncio]>=5.0.4",
  "python-jose[cryptography]>=3.3.0",
  "cryptography>=42.0.0",
  "structlog>=24.1.0",
