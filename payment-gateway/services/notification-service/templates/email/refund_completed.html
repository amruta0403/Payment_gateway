<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Refund Completed</title></head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);">
      <tr><td style="background:#16a34a;padding:28px 40px;text-align:center;">
        <div style="font-size:32px;margin-bottom:8px;">💰</div>
        <h1 style="margin:0;color:#ffffff;font-size:22px;font-weight:700;">Refund Completed</h1>
      </td></tr>
      <tr><td style="padding:40px 40px 32px;">
        <p style="margin:0 0 24px;color:#374151;font-size:15px;line-height:1.6;">
          Your refund of <strong>₹{{ amount_rupees }}</strong> has been successfully credited to your original payment method.
        </p>
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #f3f4f6;color:#6b7280;font-size:13px;width:45%;">Refund ID</td>
            <td style="padding:10px 0;border-bottom:1px solid #f3f4f6;color:#111827;font-size:13px;font-family:monospace;">{{ refund_id[:20] if refund_id else '—' }}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;color:#6b7280;font-size:13px;">Amount</td>
            <td style="padding:10px 0;color:#16a34a;font-size:14px;font-weight:600;">₹{{ amount_rupees }}</td>
          </tr>
        </table>
        <p style="margin:24px 0 0;color:#6b7280;font-size:13px;">Refunds may take 1–3 business days to appear on your bank statement.</p>
      </td></tr>
      <tr><td style="padding:20px 40px 32px;border-top:1px solid #f3f4f6;text-align:center;color:#9ca3af;font-size:12px;">
        <a href="mailto:{{ support_email }}" style="color:#16a34a;">{{ support_email }}</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>
