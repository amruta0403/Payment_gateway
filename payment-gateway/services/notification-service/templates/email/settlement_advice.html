<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Settlement Advice</title></head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);">
      <tr><td style="background:#1d4ed8;padding:28px 40px;text-align:center;">
        <div style="font-size:32px;margin-bottom:8px;">🏦</div>
        <h1 style="margin:0;color:#ffffff;font-size:22px;font-weight:700;">Settlement Advice</h1>
      </td></tr>
      <tr><td style="padding:40px 40px 32px;">
        <p style="margin:0 0 24px;color:#374151;font-size:15px;line-height:1.6;">
          Your settlement has been processed and funds will be credited to your registered bank account within 1 business day.
        </p>
        <table width="100%" cellpadding="0" cellspacing="0" style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;margin-bottom:24px;">
          <tr><td style="padding:20px 24px;text-align:center;">
            <div style="color:#6b7280;font-size:13px;margin-bottom:4px;">Net Settlement Amount</div>
            <div style="color:#1d4ed8;font-size:28px;font-weight:700;">₹{{ amount_rupees }}</div>
          </td></tr>
        </table>
        <p style="margin:0;color:#6b7280;font-size:13px;line-height:1.6;">
          Gross amount, fees, and GST details are available on your merchant dashboard.
        </p>
      </td></tr>
      <tr><td style="padding:20px 40px 32px;border-top:1px solid #f3f4f6;text-align:center;color:#9ca3af;font-size:12px;">
        <a href="mailto:{{ support_email }}" style="color:#1d4ed8;">{{ support_email }}</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>
