# =============================================================================
# CELERY WORKERS
# =============================================================================

  celery-worker-settlement:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    <<: *service-defaults
    command:
      - celery
      - -A
      - celery_app:celery_app
      - worker
      - --queues=settlement
      - --concurrency=2
      - --loglevel=info
      - --hostname=settlement@%h
    depends_on:
      redis:
        condition: service_healthy
      postgres-main:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  celery-worker-notification:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    <<: *service-defaults
    command:
      - celery
      - -A
      - celery_app:celery_app
      - worker
      - --queues=notification,email,sms
      - --concurrency=4
      - --loglevel=info
      - --hostname=notification@%h
    depends_on:
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  celery-beat:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    <<: *service-defaults
    command:
      - celery
      - -A
      - celery_app:celery_app
      - beat
      - --scheduler=celery.beat:PersistentScheduler
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=info
    volumes:
      - /tmp/celerybeat-schedule:/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      postgres-main:
        condition: service_healthy
