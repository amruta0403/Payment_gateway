      retries: 3
      start_period: 40s
    depends_on:
      postgres-main:
        condition: service_healthy
      redpanda:
        condition: service_healthy

# ─── Celery Workers ───────────────────────────────────────────────────────────

  celery-worker-settlement:
    build: ./services/settlement-service
    <<: *service-defaults
    command: celery -A tasks worker -Q settlement -c 2 --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres-main:
        condition: service_healthy

  celery-worker-notification:
    build: ./services/notification-service
    <<: *service-defaults
    command: celery -A tasks worker -Q notification -c 4 --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    build: ./services/settlement-service
    <<: *service-defaults
    command: celery -A tasks beat --scheduler celery.beat:PersistentScheduler --loglevel=info
    volumes:
      - /tmp/celerybeat-schedule:/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
