    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8019/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres-main:
        condition: service_healthy

  transaction-service:
    build: ./services/transaction-service
    <<: *service-defaults
    ports:
      - "8020:8020"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres-main:
        condition: service_healthy

  webhook-service:
    build: ./services/webhook-service
    <<: *service-defaults
    ports:
      - "8021:8021"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  reporting-service:
    build: ./services/reporting-service
    <<: *service-defaults
    ports:
      - "8022:8022"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8022/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reporting.rule=Host(`api.${DOMAIN:-localhost}`) && PathPrefix(`/v1/reports`)"
      - "traefik.http.routers.reporting.entrypoints=websecure"
      - "traefik.http.routers.reporting.middlewares=reports-ratelimit,secure-headers"
      - "traefik.http.services.reporting.loadbalancer.server.port=8022"
    depends_on:
      postgres-main:
        condition: service_healthy

  audit-service:
    build: ./services/audit-service
    <<: *service-defaults
    ports:
